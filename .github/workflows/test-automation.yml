name: Test Automation

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    workflow_dispatch:

permissions:
    contents: read

env:
    PYTHON_VERSION: "3.10"
    ARTIFACT_RETENTION_DAYS: 30

jobs:
    setup:
        name: Setup & Validate
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Display Python version
              run: python -c "import sys; print(sys.version)"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt
                  echo "✅ Dependencies installed"

    test-api:
        name: API Tests (Load, Spike, Soak, SLA, Assertions)
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                worker-index: [ 0, 1 ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Run API Test Suite (Core)
              id: api-tests
              shell: powershell
              run: |
                  $mock = Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow -PassThru
                  try {
                    $ready = $false
                    $lastError = $null
                    for ($i = 0; $i -lt 15; $i++) {
                      if ($mock.HasExited) {
                        throw "Mock API exited during startup with code $($mock.ExitCode)"
                      }
                      try {
                        Invoke-WebRequest -Uri "http://127.0.0.1:8000/get" -Method GET -UseBasicParsing -TimeoutSec 2 | Out-Null
                        $ready = $true
                        break
                      }
                      catch {
                        $lastError = $_.Exception.Message
                        Start-Sleep -Seconds 2
                      }
                    }

                    if (-not $ready) {
                      throw "Mock API did not become ready on 127.0.0.1:8000. Last error: $lastError"
                    }

                    python scripts/run-tests.py --worker-count 2 --worker-index ${{ matrix.worker-index }} --list
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python scripts/run-tests.py --health
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python scripts/run-tests.py --worker-count 2 --worker-index ${{ matrix.worker-index }}
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
                  finally {
                    if ($mock -and -not $mock.HasExited) {
                      Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
                    }
                  }

            - name: Collect Taurus Reports
              if: always()
              run: |
                  if (Test-Path "logs") {
                    Get-ChildItem -Path "logs" -Filter "*.jtl" | ForEach-Object {
                      Write-Output "Found JTL: $_"
                    }
                  }
                  else {
                    Write-Output "logs/ not found"
                  }

                  if (Test-Path "reports") {
                    Get-ChildItem -Path "reports" -Filter "*.html" | ForEach-Object {
                      Write-Output "Found Report: $_"
                    }
                  }
                  else {
                    Write-Output "reports/ not found"
                  }
              shell: powershell

            - name: Upload API Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-test-results-worker-${{ matrix.worker-index }}
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    test-jmeter:
        name: JMeter CRUD Tests
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Run JMeter CRUD Test
              id: jmeter-tests
              shell: powershell
              run: |
                  $mock = Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow -PassThru
                  try {
                    $ready = $false
                    $lastError = $null
                    for ($i = 0; $i -lt 15; $i++) {
                      if ($mock.HasExited) {
                        throw "Mock API exited during startup with code $($mock.ExitCode)"
                      }
                      try {
                        Invoke-WebRequest -Uri "http://127.0.0.1:8000/get" -Method GET -UseBasicParsing -TimeoutSec 2 | Out-Null
                        $ready = $true
                        break
                      }
                      catch {
                        $lastError = $_.Exception.Message
                        Start-Sleep -Seconds 2
                      }
                    }

                    if (-not $ready) {
                      throw "Mock API did not become ready on 127.0.0.1:8000. Last error: $lastError"
                    }

                    python scripts/run-tests.py --include-jmeter
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
                  finally {
                    if ($mock -and -not $mock.HasExited) {
                      Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
                    }
                  }

            - name: Upload JMeter Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jmeter-test-results
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    test-k6:
        name: K6 Load Tests
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Install k6
              run: choco install k6 -y
              shell: powershell

            - name: Run K6 Test
              id: k6-tests
              shell: powershell
              run: |
                  $mock = Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow -PassThru
                  try {
                    $ready = $false
                    $lastError = $null
                    for ($i = 0; $i -lt 15; $i++) {
                      if ($mock.HasExited) {
                        throw "Mock API exited during startup with code $($mock.ExitCode)"
                      }
                      try {
                        Invoke-WebRequest -Uri "http://127.0.0.1:8000/get" -Method GET -UseBasicParsing -TimeoutSec 2 | Out-Null
                        $ready = $true
                        break
                      }
                      catch {
                        $lastError = $_.Exception.Message
                        Start-Sleep -Seconds 2
                      }
                    }

                    if (-not $ready) {
                      throw "Mock API did not become ready on 127.0.0.1:8000. Last error: $lastError"
                    }

                    python scripts/run-tests.py --include-k6
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
                  finally {
                    if ($mock -and -not $mock.HasExited) {
                      Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
                    }
                  }

            - name: Upload K6 Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: k6-test-results
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    quality-gate:
        name: Quality Gate Check
        runs-on: ubuntu-latest
        needs: [ test-api, test-jmeter, test-k6 ]
        if: always()

        steps:
            - name: Check Test Results
              env:
                  API_RESULT: ${{ needs.test-api.result }}
                  JMETER_RESULT: ${{ needs.test-jmeter.result }}
                  K6_RESULT: ${{ needs.test-k6.result }}
              run: |
                  echo "test-api: $API_RESULT"
                  echo "test-jmeter: $JMETER_RESULT"
                  echo "test-k6: $K6_RESULT"
                  if [[ "$API_RESULT" != "success" ]] || \
                     [[ "$JMETER_RESULT" != "success" ]] || \
                     [[ "$K6_RESULT" != "success" ]]; then
                    echo "❌ One or more required test suites did not succeed (failure, cancelled or skipped)"
                    exit 1
                  fi
                  echo "✅ All test suites passed"
              shell: bash

            - name: Set Status
              if: success()
              run: echo "✅ Quality gate PASSED - all tests successful"

    summary:
        name: Test Summary
        runs-on: ubuntu-latest
        needs: [ quality-gate ]
        if: always()

        steps:
            - name: Print Summary
              run: |
                  echo "## Test Automation Summary"
                  echo "✅ API Tests: ${{ needs.quality-gate.result }}"
                  echo "✅ JMeter Tests: ${{ needs.quality-gate.result }}"
                  echo "✅ K6 Tests: ${{ needs.quality-gate.result }}"
                  echo ""
                  echo "Infrastructure ready for deployment"
