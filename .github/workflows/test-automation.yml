name: Test Automation

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.10"
    ARTIFACT_RETENTION_DAYS: 30

jobs:
    setup:
        name: Setup & Validate
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Display Python version
              run: python -c "import sys; print(sys.version)"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt
                  echo "✅ Dependencies installed"

    test-api:
        name: API Tests (Load, Spike, Soak, SLA, Assertions)
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                worker-index: [ 0, 1 ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Start Mock API Server
              run: |
                  # Check if port 8000 is already in use
                  $portInUse = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
                  if ($portInUse) {
                      Write-Output "⚠️ Port 8000 is already in use (likely from another worker)"
                  } else {
                      Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow
                      Start-Sleep -Seconds 3
                      Write-Output "✅ Mock API Server started on localhost:8000"
                  }
              shell: powershell

            - name: Run API Test Suite (Core)
              id: api-tests
              run: |
                  python scripts/run-tests.py --worker-count 2 --worker-index ${{ matrix.worker-index }} --list
                  python scripts/run-tests.py --health
                  python scripts/run-tests.py --worker-count 2 --worker-index ${{ matrix.worker-index }}
              continue-on-error: false

            - name: Collect Taurus Reports
              if: always()
              run: |
                  Get-ChildItem -Path "logs" -Filter "*.jtl" | ForEach-Object { 
                    Write-Output "Found JTL: $_"
                  }
                  Get-ChildItem -Path "reports" -Filter "*.html" | ForEach-Object { 
                    Write-Output "Found Report: $_"
                  }
              shell: powershell

            - name: Upload API Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-test-results-worker-${{ matrix.worker-index }}
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    test-jmeter:
        name: JMeter CRUD Tests
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Start Mock API Server
              run: |
                  Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow
                  Start-Sleep -Seconds 3
                  Write-Output "✅ Mock API Server started"
              shell: powershell

            - name: Run JMeter CRUD Test
              id: jmeter-tests
              run: |
                  python scripts/run-tests.py --include-jmeter
              continue-on-error: false

            - name: Upload JMeter Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jmeter-test-results
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    test-k6:
        name: K6 Load Tests
        runs-on: windows-latest
        needs: setup
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt

            - name: Start Mock API Server
              run: |
                  Start-Process -FilePath "python" -ArgumentList "scripts/mock-api-server.py" -NoNewWindow
                  Start-Sleep -Seconds 3
                  Write-Output "✅ Mock API Server started"
              shell: powershell

            - name: Run K6 Test
              id: k6-tests
              run: |
                  python scripts/run-tests.py --include-k6
              continue-on-error: false

            - name: Upload K6 Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: k6-test-results
                  path: |
                      logs/
                      reports/
                  retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
                  if-no-files-found: warn

    quality-gate:
        name: Quality Gate Check
        runs-on: ubuntu-latest
        needs: [ test-api, test-jmeter, test-k6 ]
        if: always()

        steps:
            - name: Check Test Results
              run: |
                  if [[ "${{ needs.test-api.result }}" == "failure" ]] || \
                     [[ "${{ needs.test-jmeter.result }}" == "failure" ]] || \
                     [[ "${{ needs.test-k6.result }}" == "failure" ]]; then
                    echo "❌ One or more test suites failed"
                    exit 1
                  fi
                  echo "✅ All test suites passed"
              shell: bash

            - name: Set Status
              if: success()
              run: echo "✅ Quality gate PASSED - all tests successful"

    summary:
        name: Test Summary
        runs-on: ubuntu-latest
        needs: [ quality-gate ]
        if: always()

        steps:
            - name: Print Summary
              run: |
                  echo "## Test Automation Summary"
                  echo "✅ API Tests: ${{ needs.quality-gate.result }}"
                  echo "✅ JMeter Tests: ${{ needs.quality-gate.result }}"
                  echo "✅ K6 Tests: ${{ needs.quality-gate.result }}"
                  echo ""
                  echo "Infrastructure ready for deployment"
