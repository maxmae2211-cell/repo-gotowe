name: Main CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.10"

jobs:
    validate:
        name: Validate & Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt

            - name: Validate YAML configs
              run: |
                  python -c "
                  import yaml, glob, sys
                  files = glob.glob('*.yml') + glob.glob('*.yaml') + glob.glob('tests/**/*.yml', recursive=True)
                  errors = []
                  for f in files:
                      try:
                          yaml.safe_load(open(f))
                      except yaml.YAMLError as e:
                          errors.append(f'{f}: {e}')
                  if errors:
                      print('YAML errors:')
                      for e in errors: print(e)
                      sys.exit(1)
                  print(f'All {len(files)} YAML files valid')
                  "

    taurus-health:
        name: Taurus Health Check
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "11"

            - name: Install Taurus
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install bzt

            - name: Health check — bzt version
              run: bzt --version

    taurus-load:
        name: Taurus Load Test
        runs-on: ubuntu-latest
        needs: taurus-health
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt

            - name: Run Taurus API test
              run: |
                  bzt test-api.yml \
                    -o settings.artifacts-dir=ci-artifacts \
                    -o settings.check-interval=2 \
                    -o modules.console.disable=true
              continue-on-error: true

            - name: Generate HTML report
              run: |
                  python generate_report.py --output taurus-report.html || \
                  echo "<html><body><h2>No report data available</h2></body></html>" > taurus-report.html

            - name: Upload Taurus artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: taurus-artifacts-${{ github.run_number }}
                  path: ci-artifacts/
                  if-no-files-found: warn

            - name: Upload HTML report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: taurus-report-${{ github.run_number }}
                  path: taurus-report.html
