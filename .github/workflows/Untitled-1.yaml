env:
  JTL_FIXTURE: tests/fixtures/sample.jtl
  MAX_FAILURES: 0
  MAX_AVG_MS: 200

# Pipeline now runs cleanly in CI using the fixture
python run_pipeline.py \
  --jtl tests/fixtures/sample.jtl \
  --max-failures 0 \
  --max-avg-ms 200 \
  --output taurus-locust-report.html

- name: Run Taurus analysis pipeline
  run: |
    python run_pipeline.py \
      --jtl ${{ env.JTL_FIXTURE }} \
      --max-failures ${{ env.MAX_FAILURES }} \
      --max-avg-ms ${{ env.MAX_AVG_MS }} \
      --output taurus-locust-report.html

# Before — multiple workflows failed due to missing JTL artifacts or live tool dependencies
ARTIFACTS_PATTERN="$(date +%Y)-*"
python run_pipeline.py --artifacts-pattern "${ARTIFACTS_PATTERN}" ...
bzt test-api.yml -o settings.artifacts-dir=ci-results

# After — all workflows use the committed fixture
python run_pipeline.py --jtl tests/fixtures/sample.jtl --max-failures 1 --max-avg-ms 200 ...