name: Full Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Generate Taurus report
        continue-on-error: true
        run: |
          python generate_report.py --output taurus-locust-report.html
      - name: Run tests (pytest)
        continue-on-error: true
        run: |
          pytest
      - name: Run documentation crawler
        continue-on-error: true
        run: |
          python vscode_docs_crawler.py
      - name: Upload ALL_DOCS.md
        uses: actions/upload-artifact@v4
        with:
          name: ALL_DOCS
          path: docs_summary/ALL_DOCS.md
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: TaurusReport
          path: taurus-locust-report.html

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Taurus report
        run: python generate_report.py --output taurus-locust-report.html
      - name: Run tests (pytest)
        run: pytest
      - name: Run documentation crawler
        run: python vscode_docs_crawler.py
      - name: Upload ALL_DOCS.md
        uses: actions/upload-artifact@v4
        with:
          name: ALL_DOCS
          path: docs_summary/ALL_DOCS.md
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: TaurusReport
          path: taurus-locust-report.html

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install black flake8
      - name: Run black (non-blocking)
        run: black --check . || true
      - name: Run flake8
        run: flake8 . > flake8_report.txt || true
      - name: Upload flake8_report.txt
        uses: actions/upload-artifact@v4
        with:
          name: flake8_report
          path: flake8_report.txt
